f" font-size="14" fill="#1D2930" font-weight="700">Northstar Scheduling</text><text x="971" y="79" font-family="Arial, sans-serif" font-size="12" fill="#5E747A" font-weight="400">Example as of October 14, 2026</text><text x="245" y="120" font-family="Arial, sans-serif" font-size="11" fill="#15766E" font-weight="700">PART 1 · BENCHMARK</text><text x="245" y="163" font-family="Arial, sans-serif" font-size="29" fill="#1D2930" font-weight="700">Investigate exports. Preserve visibility.</text><text x="245" y="195" font-family="Arial, sans-serif" font-size="14" fill="#5E747A" font-weight="400">Three invented export reports and one positive comment show how evidence becomes a focus. The small sample does not</text><text x="245" y="217" font-family="Arial, sans-serif" font-size="14" fill="#5E747A" font-weight="400">establish customer-wide prevalence.</text><rect x="245" y="246" width="335" height="111" rx="9" fill="#FFFFFF" stroke="#DCE4E5"/><text x="264" y="273" font-family="Arial, sans-serif" font-size="12" fill="#5E747A" font-weight="400">Records in fixture</text><text x="264" y="313" font-family="Arial, sans-serif" font-size="30" fill="#163F40" font-weight="700">4</text><text x="264" y="339" font-family="Arial, sans-serif" font-size="11" fill="#5E747A" font-weight="400">All comments are invented</text><rect x="598" y="246" width="335" height="111" rx="9" fill="#FFFFFF" stroke="#DCE4E5"/><text x="617" y="273" font-family="Arial, sans-serif" font-size="12" fill="#5E747A" font-weight="400">Sources</text><text x="617" y="313" font-family="Arial, sans-serif" font-size="30" fill="#163F40" font-weight="700">2</text><text x="617" y="339" font-family="Arial, sans-serif" font-size="11" fill="#5E747A" font-weight="400">Both sources are fictional</text><rect x="951" y="246" width="335" height="111" rx="9" fill="#FFFFFF" stroke="#DCE4E5"/><text x="970" y="273" font-family="Arial, sans-serif" font-size="12" fill="#5E747A" font-weight="400">Customer-wide prevalence</text><text x="970" y="313" font-family="Arial, sans-serif" font-size="30" fill="#163F40" font-weight="700">Unknown</text><text x="970" y="339" font-family="Arial, sans-serif" font-size="11" fill="#5E747A" font-weight="400">No representative sample</text><rect x="245" y="380" width="1041" height="194" rx="9" fill="#FFFFFF" stroke="#DCE4E5"/><text x="267" y="412" font-family="Arial, sans-serif" font-size="18" fill="#1D2930" font-weight="700">Where to focus</text><text x="267" y="435" font-family="Arial, sans-serif" font-size="12" fill="#5E747A" font-weight="400">October 1–12, 2026 · scheduling administrators · synthetic sample</text><text x="267" y="471" font-family="Arial, sans-serif" font-size="10" fill="#5E747A" font-weight="700">THEME</text><text x="761" y="471" font-family="Arial, sans-serif" font-size="10" fill="#5E747A" font-weight="700">RECORDS</text><text x="901" y="471" font-family="Arial, sans-serif" font-size="10" fill="#5E747A" font-weight="700">SIGNAL</text><text x="1071" y="471" font-family="Arial, sans-serif" font-size="10" fill="#5E747A" font-weight="700">NEXT STEP</text><text x="267" y="507" font-family="Arial, sans-serif" font-size="14" fill="#1D2930" font-weight="400">Large-booking export reliability</text><text x="783" y="507" font-family="Arial, sans-serif" font-size="14" fill="#1D2930" font-weight="400">3</text><rect x="901" y="490" width="68.4" height="27" rx="4" fill="#FFE9E7"/><text x="910" y="508" font-family="Arial, sans-serif" font-size="11" fill="#97443C" font-weight="400">Negative</text><text x="1071" y="507" font-family="Arial, sans-serif" font-size="13" fill="#1D2930" font-weight="400">Investigate</text><text x="267" y="548" font-family="Arial, sans-serif" font-size="14" fill="#1D2930" font-weight="400">Schedule visibility</text><text x="783" y="548" font-family="Arial, sans-serif" font-size="14" fill="#1D2930" font-weight="400">1</text><rect x="901" y="531" width="68.4" height="27" rx="4" fill="#E4F4E2"/><text x="910" y="549" font-family="Arial, sans-serif" font-size="11" fill="#2E6528" font-weight="400">Positive</text><text x="1071" y="548" font-family="Arial, sans-serif" font-size="13" fill="#1D2930" font-weight="400">Preserve and learn</text><rect x="245" y="595" width="1041" height="262" rx="9" fill="#FFFFFF" stroke="#DCE4E5"/><text x="267" y="627" font-family="Arial, sans-serif" font-size="18" fill="#1D2930" font-weight="700">Trace the evidence</text><text x="267" y="650" font-family="Arial, sans-serif" font-size="12" fill="#5E747A" font-weight="400">Source references join the benchmark to cases and company changes.</text><text x="267" y="688" font-family="Arial, sans-serif" font-size="12" fill="#15766E" font-weight="700">REV:R101</text><text x="390" y="688" font-family="Arial, sans-serif" font-size="13" fill="#1D2930" font-weight="400">Our weekly schedule export fails for the largest booking.</text><text x="267" y="732" font-family="Arial, sans-serif" font-size="12" fill="#15766E" font-weight="700">REV:R102</text><text x="390" y="732" font-family="Arial, sans-serif" font-size="13" fill="#1D2930" font-weight="400">The export fails when I select a large booking.</text><text x="267" y="776" font-family="Arial, sans-serif" font-size="12" fill="#15766E" font-weight="700">APP:R103</text><text x="390" y="776" font-family="Arial, sans-serif" font-size="13" fill="#1D2930" font-weight="400">Our large schedule will not export. Small schedules still work.</text><text x="267" y="820" font-family="Arial, sans-serif" font-size="12" fill="#15766E" font-weight="700">APP:R104</text><text x="390" y="820" font-family="Arial, sans-serif" font-size="13" fill="#1D2930" font-weight="400">The shared schedule makes upcoming shifts easy to see.</text><text x="245" y="904" font-family="Arial, sans-serif" font-size="11" fill="#5E747A" font-weight="400">All records, ownership, events, and results are invented. No live customer outcome or private deployment is claimed.</text></svg>